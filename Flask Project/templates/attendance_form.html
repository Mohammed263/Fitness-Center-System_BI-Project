<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Trainee Attendance Registration</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('register_attendance') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Trainee</label>
            <select class="form-select" name="trainee_id" required>
                <option value="" selected disabled>Select Trainee</option>
                {% for t in trainees %}
                <option value="{{ t.ID }}">{{ t.Name }} (ID: {{ t.ID }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Branch</label>
            <select class="form-select" name="branch_id" required>
                <option value="" selected disabled>Select Branch</option>
                {% for b in branches %}
                <option value="{{ b.BranchID }}">{{ b.Location }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Date & Time</label>
            <input type="datetime-local" class="form-control" name="datetime" required value="{{ now }}">
        </div>

        <button type="submit" class="btn btn-primary">Register Attendance</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
